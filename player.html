<!doctype html>
<html><head><meta charset="utf-8"><title>Stream Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  :root{--bg:#000;--panel:#141414;--field:#222;--line:#333;--text:#ddd;--muted:#888;--accent:#2d6cdf;--danger:#d9534f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer}
  .btn{padding:6px 12px;background:var(--accent);color:#fff;border:0;border-radius:4px;white-space:nowrap}
  .btn.ghost{background:var(--field);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
  input,textarea{font:inherit;background:var(--field);color:#eee;border:1px solid var(--line);border-radius:4px;padding:6px 8px}

  #bar{display:flex;gap:8px;padding:8px;background:#111;align-items:center}
  #list{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:thin}
  .ch{padding:6px 10px;background:var(--field);border:1px solid var(--line);border-radius:4px;white-space:nowrap;color:#ccc}
  .ch.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ch b{opacity:.7;margin-right:6px}

  #wrap{position:relative;flex:1;min-height:0}
  video{width:100%;height:100%;background:#000;display:block}
  #banner{position:absolute;top:20px;right:24px;padding:10px 18px;background:rgba(0,0,0,.7);
      border-left:4px solid var(--accent);font-size:22px;color:#fff;opacity:0;transition:opacity .4s;pointer-events:none}
  #banner.show{opacity:1}
  #status{padding:4px 10px;font-size:12px;color:var(--muted);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  #overlay.open{display:flex}
  #panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(720px,100%);max-height:100%;
      display:flex;flex-direction:column;overflow:hidden}
  #panel header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  #panel h2{margin:0;font-size:16px}
  #panel .body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
  #links{width:100%;min-height:90px;resize:vertical}
  .hint{color:var(--muted);font-size:12px;margin:4px 0 0}
  .row{display:flex;gap:8px;align-items:center}
  .rows{display:flex;flex-direction:column;gap:6px}
  .item{display:flex;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:4px}
  .item.on{border-color:var(--accent)}
  .item .num{width:22px;text-align:right;color:var(--muted)}
  .item input{flex:0 0 180px;min-width:0}
  .item .url{flex:1;min-width:0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon{background:none;border:1px solid transparent;color:var(--text);border-radius:4px;padding:3px 7px;opacity:.7}
  .icon:hover{opacity:1;border-color:var(--line)}
  .icon:disabled{opacity:.2;cursor:default;border-color:transparent}
  .empty{color:var(--muted);text-align:center;padding:12px}
  #panel footer{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
  @media (max-width:600px){ .item input{flex-basis:110px} #banner{font-size:16px;right:12px} }
</style></head>
<body>
<div id="bar">
  <button class="btn ghost" id="manage" title="Manage channels (C)">☰ Channels</button>
  <div id="list"></div>
  <button class="btn" id="addBtn">+ Add</button>
</div>
<div id="wrap"><video id="v" controls autoplay playsinline></video><div id="banner"></div></div>
<div id="status"></div>

<div id="overlay">
  <div id="panel" role="dialog" aria-label="Channels">
    <header><h2>Channels</h2><button class="icon" id="close" title="Close (Esc)">✕</button></header>
    <div class="body">
      <div>
        <textarea id="links" placeholder="Paste one or more .m3u8 links, one per line"></textarea>
        <p class="hint">To name a channel, write it as <code>Name | link</code>. Links without a name become “Channel N”.</p>
        <div class="row" style="justify-content:flex-end;margin-top:8px">
          <span id="addMsg" class="hint" style="margin:0 auto 0 0"></span>
          <button class="btn" id="addLinks">Add channels</button>
        </div>
      </div>
      <div class="rows" id="items"></div>
    </div>
    <footer>
      <button class="btn danger" id="clearAll">Remove all</button>
      <button class="btn ghost" id="done">Done</button>
    </footer>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const v = $('v'), status = $('status'), banner = $('banner'), overlay = $('overlay');
let hls, channels = [], cur = -1, prev = -1, bannerTimer;
const say = t => status.textContent = t;
const label = i => channels[i].name || 'Channel ' + (i + 1);
const keys = 'Keys: ↑/↓ or N/P change channel · 1–9 jump · L last channel · C channels';

/* ---------- storage (server keeps channels.json) ---------- */
function save() {
  fetch('/channels', { method: 'POST', body: JSON.stringify(channels) })
    .catch(() => say('Could not save channels. Is the server still running?'));
}

/* ---------- top bar ---------- */
function renderBar() {
  $('list').innerHTML = '';
  channels.forEach((c, i) => {
    const el = document.createElement('button');
    el.className = 'ch' + (i === cur ? ' on' : '');
    el.title = c.url;
    el.innerHTML = '<b></b><span></span>';
    el.querySelector('b').textContent = i + 1;
    el.querySelector('span').textContent = label(i);
    el.onclick = () => tune(i);
    $('list').appendChild(el);
  });
  const on = $('list').querySelector('.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/* ---------- channel manager panel ---------- */
function renderPanel() {
  const box = $('items');
  box.innerHTML = '';
  if (!channels.length) { box.innerHTML = '<div class="empty">No channels yet. Paste a link above.</div>'; return; }
  channels.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'item' + (i === cur ? ' on' : '');
    row.innerHTML = `<span class="num"></span><input aria-label="Channel name"><span class="url"></span>
      <button class="icon" data-a="play" title="Play">▶</button>
      <button class="icon" data-a="up" title="Move up">↑</button>
      <button class="icon" data-a="down" title="Move down">↓</button>
      <button class="icon" data-a="del" title="Remove">✕</button>`;
    row.querySelector('.num').textContent = i + 1;
    const name = row.querySelector('input');
    name.value = c.name;
    name.placeholder = 'Channel ' + (i + 1);
    name.onchange = () => { c.name = name.value.trim(); save(); renderBar(); };
    const url = row.querySelector('.url');
    url.textContent = c.url; url.title = c.url;
    row.querySelector('[data-a=up]').disabled = i === 0;
    row.querySelector('[data-a=down]').disabled = i === channels.length - 1;
    row.querySelector('[data-a=play]').onclick = () => { tune(i); closePanel(); };
    row.querySelector('[data-a=up]').onclick = () => move(i, -1);
    row.querySelector('[data-a=down]').onclick = () => move(i, 1);
    row.querySelector('[data-a=del]').onclick = () => remove(i);
    box.appendChild(row);
  });
}

function render() { renderBar(); renderPanel(); }

function openPanel(focusLinks) {
  $('addMsg').textContent = '';
  renderPanel();
  overlay.classList.add('open');
  if (focusLinks) $('links').focus();
}
function closePanel() { overlay.classList.remove('open'); }

function parseLinks(text) {
  const out = [], bad = [];
  text.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    let name = '', url = line;
    const bar = line.lastIndexOf('|');
    if (bar > -1 && /https?:\/\//i.test(line.slice(bar + 1))) {
      name = line.slice(0, bar).trim();
      url = line.slice(bar + 1).trim();
    }
    url = url.replace(/^['"]|['"]$/g, '');
    if (/^https?:\/\/\S+$/i.test(url)) out.push({ name, url }); else bad.push(line);
  });
  return { out, bad };
}

function addLinks() {
  const { out, bad } = parseLinks($('links').value);
  if (!out.length) { $('addMsg').textContent = bad.length ? 'That doesn’t look like a link.' : ''; return; }
  const first = channels.length;
  channels.push(...out);
  save();
  $('links').value = bad.join('\n');
  $('addMsg').textContent = `Added ${out.length} channel${out.length > 1 ? 's' : ''}` +
    (bad.length ? `. ${bad.length} line${bad.length > 1 ? 's' : ''} skipped (not a link).` : '.');
  if (cur < 0) tune(first); else render();
}

function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= channels.length) return;
  [channels[i], channels[j]] = [channels[j], channels[i]];
  const fix = k => k === i ? j : k === j ? i : k;
  cur = fix(cur); prev = fix(prev);
  remember();
  save(); render();
}

function remove(i) {
  channels.splice(i, 1);
  save();
  prev = -1;
  if (i === cur) { cur = -1; if (channels.length) return tune(Math.min(i, channels.length - 1)); stop(); return; }
  if (i < cur) cur--;
  remember();
  render();
}

$('addLinks').onclick = addLinks;
$('links').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addLinks(); };
$('manage').onclick = () => openPanel(false);
$('addBtn').onclick = () => openPanel(true);
$('close').onclick = $('done').onclick = closePanel;
overlay.onclick = e => { if (e.target === overlay) closePanel(); };
$('clearAll').onclick = () => {
  if (!channels.length || !confirm('Remove all channels?')) return;
  channels = []; cur = prev = -1; save(); stop();
};

/* ---------- playback ---------- */
function showBanner(text) {
  banner.textContent = text;
  banner.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => banner.classList.remove('show'), 3000);
}

function remember() {
  try { localStorage.setItem('lastChannel', String(cur)); } catch (e) {}
}

// Browsers block autoplay with sound: fall back to muted autoplay, unmute on first click.
function start() {
  v.play().catch(() => {
    v.muted = true;
    v.play().then(() => say('Playing muted (autoplay rule) · click the video to unmute · ' + keys)).catch(() => {});
  });
}
v.addEventListener('click', () => { if (v.muted) { v.muted = false; say('Playing · ' + keys); } });
v.addEventListener('playing', () => { if (!v.muted) say('Playing · ' + keys); });

function stop() {
  if (hls) { hls.destroy(); hls = null; }
  v.removeAttribute('src'); v.load();
  cur = -1;
  render();
  say('No channels yet. Click “+ Add” to paste a link.');
  openPanel(true);
}

function tune(i) {
  if (!channels.length) return stop();
  i = (i + channels.length) % channels.length;
  if (i !== cur) prev = cur;
  cur = i;
  remember();
  render();
  showBanner(`${i + 1} · ${label(i)}`);
  say('Tuning…');

  const src = '/proxy?url=' + encodeURIComponent(channels[i].url);
  if (hls) hls.destroy();
  if (window.Hls && Hls.isSupported()) {
    let netRetries = 0;
    hls = new Hls({ lowLatencyMode: true });
    hls.loadSource(src);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, start);
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (d.details === 'mediaSourceRequiresReset') { hls.recoverMediaError(); start(); return; }
      if (!d.fatal) return;
      // hls.js already retries playlist loads itself; only retry segment/key failures here.
      const isPlaylist = /^(manifest|level)/.test(d.details);
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR && !isPlaylist && netRetries++ < 3) { hls.startLoad(); return; }
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      const code = d.response && d.response.code;
      const why = code === 403 || code === 401 ? 'link expired or not authorized (HTTP ' + code + ')'
                : code ? `HTTP ${code}` : d.details;
      say(`Can't play ${label(i)}: ${why}. Open Channels to add a fresh link or remove this one.`);
    });
  } else {           // Safari plays HLS natively
    v.src = src; start();
  }
}

/* ---------- TV remote keys (ignored while typing) ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePanel(); return; }
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'c') { overlay.classList.contains('open') ? closePanel() : openPanel(false); }
  else if (!channels.length || overlay.classList.contains('open')) return;
  else if (k === 'arrowup' || k === 'n' || k === 'pageup') tune(cur + 1);
  else if (k === 'arrowdown' || k === 'p' || k === 'pagedown') tune(cur - 1);
  else if (k === 'l' && prev >= 0) tune(prev);
  else if (/^[1-9]$/.test(k) && +k <= channels.length) tune(+k - 1);
  else return;
  e.preventDefault();
});

fetch('/channels').then(r => r.json()).then(list => {
  channels = list;
  let last = 0;
  try { last = +localStorage.getItem('lastChannel') || 0; } catch (e) {}
  if (channels.length) tune(last < channels.length ? last : 0); else stop();
}).catch(() => say('Could not reach the server. Start it with: python3 play.py'));
</script>
</body></html>
